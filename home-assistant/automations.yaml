- id: roomsense_room1_co2_high_alert
  alias: "RoomSense room1 CO2 visoka razina"
  trigger:
    - platform: numeric_state
      entity_id: sensor.roomsense_room1_co2
      above: 1000
  action:
    - service: persistent_notification.create
      data:
        title: "RoomSense room1 - CO2"
        message: "CO2 razina je {{ states('sensor.roomsense_room1_co2') }} ppm. Potrebno provjetravanje."
        notification_id: roomsense_room1_co2_alert

- id: roomsense_room1_co2_critical_alert
  alias: "RoomSense room1 CO2 kriticna razina"
  trigger:
    - platform: numeric_state
      entity_id: sensor.roomsense_room1_co2
      above: 2000
  action:
    - service: persistent_notification.create
      data:
        title: "RoomSense room1 - kriticno"
        message: "CO2 razina je {{ states('sensor.roomsense_room1_co2') }} ppm. Hitno provjetravanje."
        notification_id: roomsense_room1_co2_critical

- id: roomsense_room1_co2_normal
  alias: "RoomSense room1 CO2 normalizacija"
  trigger:
    - platform: numeric_state
      entity_id: sensor.roomsense_room1_co2
      below: 800
  action:
    - service: persistent_notification.dismiss
      data:
        notification_id: roomsense_room1_co2_alert
    - service: persistent_notification.dismiss
      data:
        notification_id: roomsense_room1_co2_critical

- id: roomsense_room1_temperature_high_alert
  alias: "RoomSense room1 temperatura previsoka"
  trigger:
    - platform: numeric_state
      entity_id: sensor.roomsense_room1_temperature
