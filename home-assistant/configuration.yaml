default_config:

lovelace:
  dashboards:
    roomsense-rooms:
      mode: yaml
      title: RoomSense sobe
      icon: mdi:floor-plan
      show_in_sidebar: true
      filename: dashboards/roomsense-rooms.yaml
    roomsense-admin:
      mode: yaml
      title: RoomSense admin
      icon: mdi:account-cog
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/roomsense-admin.yaml

mqtt:
  sensor:
    - name: "RoomSense Room 1 Temperature"
      unique_id: roomsense_room1_temperature
      default_entity_id: sensor.roomsense_room1_temperature
      state_topic: "roomsense/room1/telemetry"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.temperature | float }}"
      availability_topic: "roomsense/room1/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "RoomSense Room 1 Humidity"
      unique_id: roomsense_room1_humidity
      default_entity_id: sensor.roomsense_room1_humidity
      state_topic: "roomsense/room1/telemetry"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      value_template: "{{ value_json.humidity | float }}"
      availability_topic: "roomsense/room1/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "RoomSense Room 1 CO2"
      unique_id: roomsense_room1_co2
      default_entity_id: sensor.roomsense_room1_co2
      state_topic: "roomsense/room1/telemetry"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      value_template: "{{ value_json.co2 | int }}"
      availability_topic: "roomsense/room1/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "RoomSense Room 2 Temperature"
      unique_id: roomsense_room2_temperature
      default_entity_id: sensor.roomsense_room2_temperature
      state_topic: "roomsense/room2/telemetry"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.temperature | float }}"
      availability_topic: "roomsense/room2/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "RoomSense Room 2 Humidity"
      unique_id: roomsense_room2_humidity
      default_entity_id: sensor.roomsense_room2_humidity
      state_topic: "roomsense/room2/telemetry"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      value_template: "{{ value_json.humidity | float }}"
      availability_topic: "roomsense/room2/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "RoomSense Room 2 CO2"
      unique_id: roomsense_room2_co2
      default_entity_id: sensor.roomsense_room2_co2
      state_topic: "roomsense/room2/telemetry"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      value_template: "{{ value_json.co2 | int }}"
      availability_topic: "roomsense/room2/status"
      payload_available: "online"
      payload_not_available: "offline"

  switch:
    - name: "Klimatizacija"
      unique_id: roomsense_aircond
      command_topic: "room1/aircond"
      payload_on: "1"
      payload_off: "0"
      retain: true

    - name: "Ventilacija"
      unique_id: roomsense_airflow
      command_topic: "room1/airflow"
      payload_on: "1"
      payload_off: "0"
      retain: true

    - name: "Odvlaživanje"
      unique_id: roomsense_dehumid
      command_topic: "room1/dehumid"
      payload_on: "1"
      payload_off: "0"
      retain: true

automation: !include automations.yaml
